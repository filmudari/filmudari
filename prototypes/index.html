<!doctype html>
<html lang="lv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FilmuDari · prototipi</title>
  <style>
    :root { --bg: #f4f4f1; --fg: #151515; --muted: #6b6b66; --line: #d9d8d2; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { max-width: 1200px; margin: 0 auto; padding: 40px 16px 64px; }
    h1 { font-size: 28px; margin: 0 0 4px; }
    h2 { font-size: 15px; font-weight: 600; color: var(--muted); margin: 40px 0 12px; }
    .grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); }
    .tile { display: block; text-decoration: none; color: inherit; border-radius: 10px; overflow: hidden; border: 1px solid var(--line); background: #fff; transition: transform .15s, box-shadow .15s; }
    .tile:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgb(0 0 0 / .08); }
    .tile:focus-visible { outline: 3px solid #2C40A7; outline-offset: 3px; }
    .swatch { height: 120px; }
    .tile div { padding: 14px 16px 16px; }
    .tile strong { display: block; font-size: 18px; }
    .tile span { color: var(--muted); font-size: 14px; }
    .links { margin-top: 6px; font-size: 14px; }
    .a { background: radial-gradient(60% 80% at 30% 40%, #E8A33D, transparent 60%), #0B0B0C; }
    .b { background: repeating-linear-gradient(-45deg, #141414 0 2px, transparent 2px 8px), #F5F2EA; }
    .c { background: radial-gradient(circle at 70% 40%, #F237A1 0 26%, transparent 27%), #2C40A7; }
    .f { background: linear-gradient(#333231, #333231) 12% 60% / 40% 46% no-repeat, linear-gradient(#5c6b54, #5c6b54) 86% 72% / 22% 14% no-repeat, linear-gradient(160deg, #2a1414, #8a1b1b 60%, #3b0d0d), #eeecea; }
    .g { background: repeating-linear-gradient(90deg, #1B1E21 0 6px, transparent 6px 10px) 10% 50% / 34% 34px no-repeat, linear-gradient(#9E3039, #9E3039) 44.5% 50% / 6px 34px no-repeat, repeating-linear-gradient(90deg, #E3DFD6 0 6px, transparent 6px 10px) 90% 50% / 46% 34px no-repeat, #F7F5F0; }
    .d { background: repeating-linear-gradient(-30deg, #1DAD97 0 3px, transparent 3px 11px), radial-gradient(circle at 25% 50%, #FFC93C 0 18%, transparent 19%), #F4EDE0; }
  </style>
</head>
<body>
  <main>
    <h1>FilmuDari</h1>
    <h2>Prototipi</h2>
    <div class="grid">
      <a class="tile" href="a-kinozale/"><span class="swatch a" style="display:block"></span><div><strong>A · Kinozāle</strong><span>frontend-design</span></div></a>
      <a class="tile" href="b-programma/"><span class="swatch b" style="display:block"></span><div><strong>B · Festivāla programma</strong><span>editorial</span></div></a>
      <a class="tile" href="c-plakats/"><span class="swatch c" style="display:block"></span><div><strong>C · Plakāts</strong><span>riso</span></div></a>
      <a class="tile" href="d-skicenes/"><span class="swatch d" style="display:block"></span><div><strong>D · Skicenes</strong><span>sketch</span></div></a>
      <a class="tile" href="f-taste/"><span class="swatch f" style="display:block"></span><div><strong>F · Kinozāles foto</strong><span>taste-skill</span></div></a>
      <a class="tile" href="g-uiux/"><span class="swatch g" style="display:block"></span><div><strong>G · Uzticams</strong><span>ui-ux-pro-max</span></div></a>
    </div>
  </main>
</body>
</html>
